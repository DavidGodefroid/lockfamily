name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -s sh install.sh tests/install_test.sh

  # install.sh in clean containers, as a non-root user with no cosign and no
  # docker: busybox sh (alpine) and dash (debian), against a fake release.
  install-clean:
    name: install.sh (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ["alpine:3.22", "debian:13-slim", "ubuntu:24.04"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tests
        run: docker run --rm -v "$PWD:/src:ro" -w /src --user 1000:1000 -e HOME=/tmp/h "${{ matrix.image }}" sh tests/install_test.sh

  # The same tests on the runners, with a real cosign: a bundle that does not
  # verify must abort the install.
  install-cosign:
    name: install.sh + cosign (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1
      - name: tests
        run: COSIGN_REAL="$(command -v cosign)" sh tests/install_test.sh

  # The whole family, installed for real from GitHub at the versions of the
  # tap's formulas (signatures, checksums, image digests), on a runner
  # without cosign: install.sh downloads its pinned cosign, then installs it.
  # The launchers' `version` prints their own version and image, then fails
  # on the Docker that does not answer (DOCKER_HOST): nothing is pulled.
  install-release:
    name: install.sh (tap versions, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install
        run: sh install.sh
      - name: the tap's versions
        env:
          DOCKER_HOST: unix:///nonexistent/docker.sock
        run: |
          bin="$HOME/.local/bin"
          tap=https://raw.githubusercontent.com/DavidGodefroid/homebrew-tap/main/Formula
          v() { curl -fsSL "$tap/$1.rb" | sed -n 's|.*/releases/download/v\([0-9][^/]*\)/.*|\1|p' | sed -n 1p; }
          test "$("$bin/lox" version)" = "lox $(v lox)"
          test "$("$bin/lea" version)" = "v$(v lea)"
          if [ -x "$bin/cosign" ]; then "$bin/cosign" version; else cosign version; fi
          tools="locksql lockmq lockhttp"
          if [ "$RUNNER_OS" = Linux ]; then tools="$tools lockfile"; else test ! -e "$bin/lockfile"; fi
          for t in $tools; do
            out=$("$bin/$t" version 2>&1 || true)
            echo "$out"
            case "$out" in
            "$t launcher $(v "$t") (image ghcr.io/davidgodefroid/$t@sha256:"*) ;;
            *) echo "unexpected: $out" >&2; exit 1 ;;
            esac
          done
