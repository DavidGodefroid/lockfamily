<!doctype html><html data-accent="{{LOCK}}"><head><meta charset="utf-8"><link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/lock-site.css">
<!-- The 1200x630 social card, on the product's coloured stock (COLOUR.md).
     Render it with a light colour scheme. -->
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{box-sizing:border-box;width:1200px;height:630px;padding:60px 72px 44px;display:grid;grid-template-columns:250px 1fr;grid-template-rows:1fr auto;gap:36px 64px;align-items:center;background:var(--accent-stock) linear-gradient(100deg,var(--accent-stock) 0 36%,var(--accent-stock-2) 70% 100%);border-top:14px solid var(--accent)}
.og .logo{width:250px;height:250px;display:grid;place-items:center;background:var(--card);border:2px solid var(--ink);border-radius:var(--radius);box-shadow:14px 14px 0 var(--accent)}
.og .logo img{width:200px;height:200px}
.og .lab{font:600 22px/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin:0 0 12px}
.og h1{font-size:112px;margin:0 0 14px;line-height:1;max-width:none}
.og p.t{font:400 40px/1.3 var(--font-text);margin:0;max-width:25ch}
.og p.t span{color:var(--accent-ink);font-weight:600}
.og .foot{grid-column:1/-1;border-top:3px dashed var(--accent);padding-top:20px;font:600 22px var(--font-mono);color:var(--ink);display:flex;justify-content:space-between}
.icon{width:180px;height:180px;display:grid;place-items:center;background:var(--accent-stock)}
.icon img{width:150px;height:150px}
</style></head><body>
<div class="og"><div class="logo"><img src="assets/logo.svg" alt=""></div><div><p class="lab">A Lock of the Lock Family</p><h1>{{LOCK}}</h1><p class="t">{{TAGLINE_FIRST}} <span>{{TAGLINE_KEY}}</span></p></div>
<div class="foot"><span>{{SOURCES}}</span><span>lockfamily.dev</span></div></div>
</body></html>
