<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 330" width="1140" height="330" role="img" aria-labelledby="t d">
<title id="t">Three directions for lockfamily.dev</title>
<desc id="d">Quick mock-ups. A, industrial: brushed steel, a stencil title, a padlock with key cuts. B, terminal-native: a full console screen, monospace only. C, the signed ticket, chosen: a paper ticket with fields, a perforated stub and a blue approval stamp.</desc>
<style>text{font-family:Georgia,serif}.m{font-family:ui-monospace,Menlo,Consolas,monospace}.s{font-family:Impact,"Arial Narrow",sans-serif;letter-spacing:2px}</style>
<rect width="1140" height="330" fill="#ffffff"/>
<!-- A. industrial -->
<g transform="translate(20 20)">
  <rect width="350" height="250" rx="4" fill="#5d6166"/>
  <rect x="10" y="10" width="330" height="230" rx="3" fill="#8a8f95"/>
  <path d="M10 60 H340 M10 110 H340 M10 160 H340 M10 210 H340" stroke="#9ba0a6" stroke-width="1"/>
  <text x="26" y="56" class="s" font-size="30" fill="#1f2226">LOCK FAMILY</text>
  <text x="26" y="80" class="m" font-size="11" fill="#1f2226">SERIAL 04-17 · CLASS WRITE</text>
  <path d="M240 120 V100 a30 30 0 0 1 60 0 V120" fill="none" stroke="#c9ccd0" stroke-width="12"/>
  <rect x="226" y="118" width="88" height="80" rx="6" fill="#b0892f" stroke="#6b5216" stroke-width="3"/>
  <path d="M40 180 h16 l6 -10 l6 10 h12 l6 -14 l6 14 h60" fill="none" stroke="#1f2226" stroke-width="5"/>
  <circle cx="270" cy="150" r="8" fill="#1f2226"/>
  <rect x="34" y="206" width="120" height="20" fill="#e3c12a"/>
  <text x="40" y="221" class="s" font-size="13" fill="#1f2226">AUTHORISED ONLY</text>
</g>
<text x="20" y="300" font-size="15" font-weight="700" fill="#1d1b17">A · industrial</text>
<text x="20" y="320" font-size="12" fill="#575146">stock "security" imagery; no human decision in it. Rejected.</text>
<!-- B. terminal -->
<g transform="translate(395 20)">
  <rect width="350" height="250" rx="4" fill="#0b0f0c"/>
  <g class="m" font-size="11.5">
    <text x="14" y="28" fill="#4ade80">$ lox run</text>
    <text x="14" y="50" fill="#a3b1a6">lox run AUTO ~/shop        ● hub up · 1 lock</text>
    <text x="14" y="72" fill="#a3b1a6">14:01 claude ◆ shop replica read  auto ✓</text>
    <text x="14" y="92" fill="#a3b1a6">14:03 claude ◆ shop primary</text>
    <text x="14" y="112" fill="#fbbf24">◆ QUESTION write on shop/primary</text>
    <text x="14" y="132" fill="#e2e8f0">UPDATE orders SET status = ‹p***(4)›</text>
    <text x="14" y="152" fill="#e2e8f0">y approve   n deny</text>
    <text x="14" y="180" fill="#4ade80"># HARNESS SECURITY FOR AI AGENTS</text>
    <text x="14" y="200" fill="#4ade80"># the agent asks; you answer here.</text>
    <text x="14" y="230" fill="#4ade80">█</text>
  </g>
</g>
<text x="395" y="300" font-size="15" font-weight="700" fill="#1d1b17">B · terminal-native</text>
<text x="395" y="320" font-size="12" fill="#575146">honest, but all-mono prose and the green-on-black cliché. Kept for real screens.</text>
<!-- C. signed ticket -->
<g transform="translate(770 20)">
  <rect width="350" height="250" rx="4" fill="#f4efe4"/>
  <rect x="30" y="20" width="290" height="210" rx="3" fill="#fffcf5" stroke="#1d1b17"/>
  <text x="44" y="42" class="m" font-size="10" font-weight="700" fill="#1d1b17">TICKET</text>
  <text x="306" y="42" class="m" font-size="10" font-weight="700" fill="#1d1b17" text-anchor="end">SHOP / PRIMARY · LOCKSQL</text>
  <path d="M44 50 H306" stroke="#1d1b17" stroke-width="2"/>
  <text x="44" y="68" class="m" font-size="8" fill="#575146">REQUEST, MASKED</text>
  <text x="44" y="84" class="m" font-size="10" fill="#1d1b17">UPDATE orders SET status = <tspan fill="#0e6158">‹p***(4)›</tspan></text>
  <path d="M44 94 H306" stroke="#b9af98"/>
  <text x="44" y="110" class="m" font-size="8" fill="#575146">THE HUB HOLDS</text>
  <text x="44" y="126" font-size="12" fill="#1d1b17">this masked screen only</text>
  <g transform="rotate(-3 50 160)"><rect x="44" y="142" width="190" height="26" rx="2" fill="none" stroke="#1f4a9c" stroke-width="3"/>
  <text x="56" y="160" class="m" font-size="11" font-weight="700" fill="#1f4a9c">APPROVED · YOU · y · 14:03</text></g>
  <path d="M30 186 H320" stroke="#b9af98" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="44" y="208" class="m" font-size="9" fill="#575146">14:03 claude ◆ shop primary write ✔ you ✓</text>
</g>
<text x="770" y="300" font-size="15" font-weight="700" fill="#1d1b17">C · the signed ticket (chosen)</text>
<text x="770" y="320" font-size="12" fill="#575146">a ticket, a ledger, a stamp: the project's own idea.</text>
</svg>
