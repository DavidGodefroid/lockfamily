<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="lockfile logo">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <!-- shackle -->
  <path d="M42 54 V38 a22 22 0 0 1 44 0 V54" fill="none" stroke="url(#shackle)" stroke-width="11" stroke-linecap="round"/>
  <!-- a document = lock body, folded corner -->
  <path d="M32 54 H86 L108 76 V102 a10 10 0 0 1 -10 10 H30 a10 10 0 0 1 -10 -10 V66 a12 12 0 0 1 12 -12 Z" fill="url(#body)"/>
  <path d="M86 54 V68 a8 8 0 0 0 8 8 H108 Z" fill="#FBCFE8"/>
  <!-- text lines the agent never reads -->
  <rect x="32" y="68" width="34" height="6" rx="3" fill="#FCE7F3" fill-opacity=".8"/>
  <rect x="32" y="78" width="22" height="6" rx="3" fill="#FCE7F3" fill-opacity=".5"/>
  <!-- keyhole -->
  <circle cx="64" cy="92" r="6" fill="#0F172A"/>
  <path d="M61 95 L59.5 104 H68.5 L67 95 Z" fill="#0F172A"/>
</svg>
