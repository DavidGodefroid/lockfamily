# The docs of lockfamily.dev/docs/ (#34): which file, or which sections of
# a README, make which page, in which tab.
#
# src      "repo:path" in the repo's default branch ("lockfamily" is this repo)
# slug     the page's path in its tab ("" for the tab's first page)
# sections the README's H2 sections the page takes, in order, or one H3 as
#          "H2 > H3" (that H3 then leaves its H2's page); none: the whole file
# intro    also take the README's top (banner, badges and link line dropped)
# bullets  H2 sections whose "- **Label.** …" bullets become headings
# title    the page's title (needed with several sections); nav: a shorter
#          label for the sidebar
#
# A section that disappears from its README fails the build: rename it here.
#
# Every repo's README.md, CHANGELOG.md, GUIDE.md and docs/**/*.md must be a
# page, or be listed in skip below: a new doc in any repo fails the build
# until it is given a place here (or skipped, with a reason).

[sources]
skip = [
  # Internal to lockfamily: the identity's design notes, not user docs.
  "lockfamily:docs/identity.md",
  "lockfamily:docs/design-note.md",
]

